name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, Lint & Typecheck
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db?sslmode=disable"
      STRIPE_SECRET_KEY: "sk_test_ci_dummy_key"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_dummy_secret"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      ADMIN_SECRET_KEY: "ci_admin_test_secret"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Static Typecheck
        run: npm test

      - name: Code Quality Linting
        run: npm run lint

      - name: Production Build Compilation
        run: npm run build
